baseURL = "/"
locale = "en-us"
title = "ItWorksSomehow"
# RSS is off for now. Every RSS link is guarded by OutputFormats.Get "rss",
# so deleting this line (outputs below still list RSS) brings them all back.
disableKinds = ["rss"]

[params]
  description = "DIY electronics, PCB design, embedded systems and 3D printing."
  author = "ItWorksSomehow"
  tagline = "IOT / PCB / AI / DIY"
  footerTagline = "If it boots, ship it. If it smokes, write a post."
  established = "2026"
  github = "https://github.com/itworkssomehowco"
  twitter = "https://x.com/ItWorksSomehow"
  twitter_handle = "@ItWorksSomehow"
  # Empty hides the footer link until an account exists.
  gumroad = ""
  coffee = ""
  email = "itworkssomehowco@gmail.com"
  # Off until the newsletter exists: hides the section, the nav Subscribe
  # button and every Newsletter link. Set to true to bring them back.
  newsletter = false
  # Form POST endpoint (Buttondown / Listmonk / …). Empty hides the form.
  newsletter_action = ""
  currentWork = "NAS server on Raspberry PI."
  currentWorkDetail = "Pi 4 running Samba for NAS + Claude MCP server over local network. Designing a 3D-printable stacked case with drive bay and airflow slots. Goal: single box, zero cloud."
  currentTheory = ""

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
