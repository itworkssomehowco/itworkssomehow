<footer>
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <a href="{{ "/" | relURL }}" class="logo" style="font-size:16px">
        <span class="logo-dot"></span>
        <span>{{ .Site.Title }}</span>
      </a>
      <p class="footer-tagline">If it oscillates, it's probably fine.</p>
    </div>
    <div class="footer-links">
      <div class="footer-links-col">
        <div class="label">Links</div>
        <ul>
          <li><a href="{{ .Site.Params.github }}" target="_blank" rel="noopener" class="mono">GitHub</a></li>
          <li><a href="{{ .Site.Params.gumroad }}" target="_blank" rel="noopener" class="mono">Gumroad</a></li>
          <li><a href="{{ .Site.Params.coffee }}" target="_blank" rel="noopener" class="mono">Buy me a coffee</a></li>
        </ul>
      </div>
      <div class="footer-links-col">
        <div class="label">Contact</div>
        <ul>
          <li><a href="mailto:{{ .Site.Params.email }}" class="mono">{{ .Site.Params.email }}</a></li>
          <li><a href="#newsletter" class="mono">Newsletter</a></li>
          <li><a href="#" class="mono">PGP key</a></li>
        </ul>
      </div>
    </div>
  </div>
  <div class="wrap footer-bar">
    <span class="mono">© {{ .Site.Params.established }}—{{ now.Format "2006" }}</span>
    <span class="mono">Personal engineering lab</span>
  </div>
</footer>
