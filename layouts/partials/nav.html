{{ $section := .Section }}
{{ if .IsHome }}{{ $section = "home" }}{{ end }}

<header class="navbar">
  <div class="wrap navbar-inner">
    <a href="{{ "/" | relURL }}" class="logo" aria-label="{{ .Site.Title }} home">
      <span class="logo-dot"></span>
      <span>{{ .Site.Title }}</span>
    </a>

    <nav class="nav-links" id="nav-links" aria-label="Main navigation">
      <a href="{{ "/" | relURL }}"       class="nav-item{{ if eq $section "home"  }} active{{ end }}">Index</a>
      <a href="{{ "/notes/" | relURL }}" class="nav-item{{ if eq $section "notes" }} active{{ end }}">Notes</a>
      <a href="{{ "/lab/" | relURL }}"   class="nav-item{{ if eq $section "lab"   }} active{{ end }}">Lab</a>
      <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener" class="nav-item nav-mobile-only">GitHub</a>
      <a href="{{ "/index.xml" | relURL }}" class="nav-item nav-mobile-only">RSS</a>
      <a href="#newsletter" class="nav-item nav-mobile-only">Subscribe</a>
    </nav>

    <div class="nav-spacer"></div>

    <div class="nav-meta">
      <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener" class="mono nav-desktop-only">GitHub</a>
      <a href="{{ "/index.xml" | relURL }}" class="mono nav-desktop-only">RSS</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Dark">
        <span class="theme-toggle-dot" aria-hidden="true"></span>
      </button>
      <a href="#newsletter" class="btn btn-solid nav-desktop-only" style="padding:8px 16px;font-size:12px">Subscribe</a>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle navigation" aria-expanded="false">
        <svg width="13" height="9" viewBox="0 0 13 9" fill="none" aria-hidden="true">
          <rect y="0" width="13" height="1" fill="currentColor"/>
          <rect y="4" width="13" height="1" fill="currentColor"/>
          <rect y="8" width="13" height="1" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</header>
