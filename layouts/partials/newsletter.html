{{- if .Site.Params.newsletter -}}
{{- $action := .Site.Params.newsletter_action -}}
<section id="newsletter" style="padding:70px 0 0">
  <div class="wrap">
    <div class="card newsletter-panel{{ if not $action }} newsletter-single{{ end }}">
      <div>
        <div class="label newsletter-kicker">{{ i18n "nlKicker" }}</div>
        <h3 class="newsletter-h serif">
          {{ i18n "nlTitle" | safeHTML }}
        </h3>
        <p class="newsletter-lede">
          {{ i18n "nlLede" }}
        </p>
      </div>
      {{/* No endpoint configured yet → no dead form. Set params.newsletter_action. */}}
      {{ with $action }}
      <form class="newsletter-form" method="post" action="{{ . }}">
        <label class="label" for="nl-email">{{ i18n "email" }}</label>
        <input class="newsletter-input" id="nl-email" type="email" name="email"
               placeholder="{{ i18n "emailPlaceholder" }}" autocomplete="email" required />
        <button type="submit" class="btn btn-solid">{{ i18n "subscribe" }}</button>
      </form>
      {{ end }}
    </div>
  </div>
</section>
{{- end }}
