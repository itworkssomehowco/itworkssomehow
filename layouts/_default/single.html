{{ define "main" }}
<main>
  <header class="page-header">
    <div class="wrap">
      {{ with .Section }}<div class="label page-header-kicker">{{ . }}</div>{{ end }}
      <h1>{{ .Title }}</h1>
    </div>
  </header>
  <section style="padding:0 0 90px">
    <div class="wrap">
      <div class="post-content">
        {{ .Content }}
      </div>
    </div>
  </section>
</main>
{{ end }}
