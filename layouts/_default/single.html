{{ define "main" }}
<main>
  <div class="page-header">
    <div class="wrap">
      <div class="page-header-kicker">/{{ upper .Section }}.LOG</div>
      <h1 class="pixel" style="font-size:28px">{{ .Title }}</h1>
    </div>
  </div>
  <section style="padding:0 0 80px">
    <div class="wrap">
      <div class="post-content">
        {{ .Content }}
      </div>
    </div>
  </section>
</main>
{{ end }}
